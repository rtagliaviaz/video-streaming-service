proxy_cache_path /var/cache/nginx
                 levels=1:2
                 keys_zone=cdn:100m
                 max_size=10g
                 inactive=24h
                 use_temp_path=off;

upstream minio_backend {
    server minio:9000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ---- Playlists (.m3u8, .mpd): sin caché ----
    location ~* \.(m3u8|mpd)$ {
        proxy_pass http://minio_backend;
        proxy_set_header Host minio:9000;

        proxy_cache off;
        proxy_pass_request_headers on;
        proxy_force_ranges on;

        # Ocultar headers CORS de MinIO (evita duplicados)
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;

        # Nuestros headers CORS
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, X-Cache-Status" always;
        add_header X-Cache-Status "BYPASS" always;
    }

    # ---- Segmentos + thumbnails + subtítulos: caché agresiva ----
    location ~* \.(m4s|mp4|ts|vtt|jpg|jpeg|png)$ {
        proxy_pass http://minio_backend;
        proxy_set_header Host minio:9000;

        proxy_cache cdn;
        proxy_cache_valid 200 206 1y;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_revalidate on;
        proxy_cache_background_update on;
        proxy_cache_key "$scheme$request_method$host$request_uri";

        proxy_force_ranges on;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Ocultar headers CORS de MinIO (evita duplicados)
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;

        # Nuestros headers CORS
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, X-Cache-Status" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Responder a preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        return 404 "Not found\n";
    }
}