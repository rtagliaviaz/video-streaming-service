services:
  redis:
    image: redis:7-alpine
    container_name: video-streaming-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: video-streaming-backend
    ports:
      - "3001:3001"
    volumes:
      - ./uploads:/app/uploads
      - ./hls:/app/hls
      - ./backend/.env:/app/.env:ro
    environment:
      - NODE_ENV=production
      - PORT=3001
      - VIDEO_FOLDER_PATH=/app/uploads
      - OUTPUT_FOLDER_PATH=/app/hls
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: video-streaming-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis-data: